<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful</title>
    <style>
      body {
        background-color: #000;
        color: #fff;
        font-family: sans-serif;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      h1 {
        color: #4caf50;
        margin-bottom: 10px;
      }
      p {
        color: #aaa;
        margin-bottom: 30px;
      }
      button {
        background-color: #4caf50;
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 18px;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <h1>PAYMENT COMPLETE!</h1>
    <p>Activating your supporter status....</p>

    <button id="returnBtn">RETURN TO GAME</button>

    <script>
      const userAgent = navigator.userAgent || '';
      const isAndroid = /Android/i.test(userAgent);
      const packageName = 'com.ki10games.skillcheck';

      // Detect if this user came from the native Android app (vs mobile web).
      // The native app launches a true browser tab via OS.shell_open, so window.opener is null.
      // The web build opens the checkout in a popup window via window.open(), so window.opener exists.
      const cameFromNativeApp = isAndroid && !window.opener;

      // 1. Notify the opener (web build only — postMessage requires window.opener)
      try {
        if (window.opener) {
          window.opener.postMessage('payment_success', '*');
        }
      } catch (e) {
        console.log('Opener lost.');
      }

      // 2. Build deep links for the native app return path
      const standardLink = 'skillcheck://premium/success';
      const intentLink =
        'intent://premium/success' +
        '#Intent;scheme=skillcheck;package=' +
        packageName +
        ';action=android.intent.action.VIEW;end;';
      const finalLink = cameFromNativeApp ? intentLink : standardLink;

      // 3. Wire up the manual return button
      const returnBtn = document.getElementById('returnBtn');
      if (returnBtn) {
        returnBtn.addEventListener('click', () => {
          if (cameFromNativeApp) {
            window.location.replace(finalLink);
          } else {
            window.close();
          }
        });
      }

      // 4. Auto-action after 1.5 seconds
      setTimeout(function () {
        if (cameFromNativeApp) {
          window.location.replace(finalLink);
        } else {
          window.close();
        }
      }, 1500);
    </script>
  </body>
</html>
