site:
  name: Skill Check
  site: 'https://skillcheckgame.com'
  base: '/'
  trailingSlash: false

  # Replace with the token from your own Google Search Console property, or delete.
  googleSiteVerificationId: ''

metadata:
  title:
    default: Skill Check — A Daily Trivia Card Game for Gamers
    template: '%s | Skill Check'
  description: 'A daily trivia card game across 86 gaming universes and 1,594 collectible cards. Build a streak, discover synergies, and compete on the global leaderboard. Free in your browser.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Skill Check
    images:
      - url: 'https://skillcheckgame.com/images/og-card.png'
        width: 1200
        height: 630
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false

analytics:
  vendors:
    googleAnalytics:
      # Paste your GA4 measurement ID here, e.g. 'G-XXXXXXXXXX', to turn analytics on.
      id: null

ui:
  theme: 'dark:only'
